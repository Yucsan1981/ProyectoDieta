<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>listaServicio</ion-title>
    <!-- BACK BUTTON -->
    <ion-buttons slot="start">  
      <ion-back-button defaultHref="/home"></ion-back-button>
     </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list>
    <ion-item *ngFor="let cd of receivedData; let i=index">
     nombre: {{ cd.nombre }} calorias: {{cd.calorias}} 
    
    </ion-item>
  </ion-list>

</ion-content>
